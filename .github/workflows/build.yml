name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # -----------------------------
  # 主要 build/test job
  # -----------------------------
  build:
    runs-on: ubuntu-20.04

    # 只跑一个 Go 版本，避免 free plan 排队
    strategy:
      matrix:
        go: [1.18]
      max-parallel: 1

    services:
      minio:
        image: fclairamb/minio-github-actions:v0.2
        ports:
          - 9000:9000

    steps:
      # 1️⃣ Checkout 代码
      - uses: actions/checkout@v3

      # 2️⃣ 设置 Go
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go }}

      # 3️⃣ 安装依赖（只在 backend 目录，不扫描 frontend/pkg）
      - name: Install backend dependencies
        working-directory: ./ # 项目根或 backend 子目录
        run: |
          go mod tidy
          go mod download

      # 4️⃣ Lint（可选）
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.54
        continue-on-error: false

      # 5️⃣ Build backend（避免扫描 frontend/pkg）
      - name: Build backend
        run: |
          go build -v ./cmd/filebrowser

      # 6️⃣ Test backend（race + coverage）
      - name: Test backend
        run: |
          sudo apt-get update && sudo apt-get install -y gcc
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./cmd/filebrowser/...
          bash <(curl -s https://codecov.io/bash)

  # -----------------------------
  # 可选状态汇总 job
  # -----------------------------
  build-status:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "All good ✅"
